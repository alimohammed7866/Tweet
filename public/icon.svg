<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- speech bubble -->
  <path d="M120 150 h272 a36 36 0 0 1 36 36 v132 a36 36 0 0 1 -36 36 H236 l-66 58 v-58 h-50 a36 36 0 0 1 -36 -36 V186 a36 36 0 0 1 36 -36 Z"
        fill="#0f1220" opacity="0.92"/>
  <!-- "A" (source) and globe-ish arrow to "文" feel: use letters A -> 文 -->
  <text x="196" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700"
        fill="#eef1ff" text-anchor="middle">A</text>
  <text x="330" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="700"
        fill="#34d399" text-anchor="middle">à</text>
  <!-- arrow -->
  <path d="M250 250 h40 m-12 -12 l12 12 l-12 12" stroke="#ffd166" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
